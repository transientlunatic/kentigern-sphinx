[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kentigern"
version = "0.5.0"
description = "A modern Sphinx theme built on Bootstrap 5 with dark mode and a three-column layout"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "MIT"
authors = [{ name = "Daniel Williams", email = "mail@daniel-williams.co.uk" }]
requires-python = ">=3.8"
dependencies = ["sphinx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://code.daniel-williams.co.uk/kentigern"
Repository = "https://github.com/transientlunatic/kentigern-sphinx"

[project.entry-points."sphinx.html_themes"]
kentigern = "kentigern"

[tool.setuptools.packages.find]
include = ["kentigern*"]

[tool.setuptools.package-data]
kentigern = [
    "theme.conf",
    "*.html",
    "static/*",
]
"kentigern.ext" = ["*.py"]
